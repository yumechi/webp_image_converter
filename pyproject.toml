[project]
name = "webp-image-converter"
version = "0.1.0"
description = "画像を webp に変換するスクリプト"
requires-python = ">=3.14"
dependencies = [
    "pillow>=12.2.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.8",
    "ty>=0.0.27",
]

[tool.uv]
package = false
# サプライチェーンリスク対策: リリースから 7 日以上経過したバージョンのみ採用する。
# uv 0.11.4+ の relative timestamp 機能でロック実行時点を基準に解釈される。
required-version = ">=0.11.4"
exclude-newer = "7 days"

[tool.ruff]
line-length = 79
target-version = "py314"
extend-exclude = [".venv", ".mypy_cache"]

[tool.ruff.format]
# black 互換のフォーマッタ。デフォルト設定で十分。

[tool.ruff.lint]
# まずは pycodestyle (E) / pyflakes (F) / isort (I) の最小セットから。
select = ["E", "F", "I"]

[tool.ty]
# 型チェッカ ty (Astral, alpha) の設定。
# Python バージョンは .python-version / requires-python から拾う。

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
