[project]
name = "webp-image-converter"
version = "0.1.0"
description = "画像を webp に変換するスクリプト"
requires-python = ">=3.14"
dependencies = [
    "pillow>=12.2.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "black>=26.3.1",
    "mypy>=1.20.0",
]

[tool.uv]
package = false
# サプライチェーンリスク対策: リリースから 7 日以上経過したバージョンのみ採用する。
# 依存を更新する際はこの日付を作業日 (もしくは 7 日前) にバンプして `uv lock` する。
exclude-newer = "2026-04-02T00:00:00Z"

[tool.black]
line-length = 79
target-version = ['py314']
include = '\.pyi?$'
exclude = '''
/(
  \.eggs
  | \.git
  | \.mypy_cache
  | \.venv
)/
'''

[tool.mypy]
python_version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
